<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Agent Memory</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">AM</span>
          <div><strong>Agent Memory</strong><small id="project-root">Loading project…</small></div>
        </div>
        <nav id="navigation" aria-label="Workspace"></nav>
        <button class="new-button" id="new-entry" type="button">＋ New entry</button>
      </aside>

      <main>
        <header class="toolbar">
          <div><p class="eyebrow">WORKSPACE</p><h1 id="page-title">Progress</h1></div>
          <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search this project" aria-label="Search this project"></label>
        </header>

        <div class="workspace">
          <section class="collection" aria-label="Entries">
            <div class="collection-meta"><span id="result-count">0 items</span><select id="filter" aria-label="Filter"><option value="all">All statuses</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="blocked">Blocked</option></select></div>
            <div id="entry-list" class="entry-list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
          </section>
          <section class="detail" id="detail" aria-live="polite">
            <div class="empty-detail"><span class="empty-icon" aria-hidden="true">◇</span><h2>Select an entry</h2><p>Choose an item to inspect its content, history, and artifacts.</p></div>
          </section>
        </div>
      </main>
    </div>
    <dialog id="entry-dialog" aria-labelledby="entry-dialog-title">
      <form id="entry-form" method="dialog">
        <div class="dialog-header">
          <div><p class="eyebrow">NEW ENTRY</p><h2 id="entry-dialog-title">Add to project</h2></div>
          <button class="icon-button" id="close-entry" type="button" aria-label="Close">×</button>
        </div>
        <label>Type<select id="entry-kind" required><option value="knowledge">Knowledge</option><option value="skill">Skill</option><option value="progress">Progress</option></select></label>
        <label>Name<input id="entry-name" required maxlength="120" placeholder="A concise, searchable title"></label>
        <label>Content<textarea id="entry-body" required maxlength="50000" placeholder="What should this project remember?"></textarea></label>
        <p class="form-error" id="entry-error" role="alert"></p>
        <div class="dialog-actions"><button class="secondary-button" id="cancel-entry" type="button">Cancel</button><button class="new-button save-button" type="submit">Add entry</button></div>
      </form>
    </dialog>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
